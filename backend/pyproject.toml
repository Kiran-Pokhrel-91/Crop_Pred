[project]
name = "nepal-crop-prediction-backend"
version = "0.1.0"
description = "Django REST API for the Nepal Crop Prediction Platform"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15.2",
    "django-cors-headers>=4.4.0",
    "python-dotenv>=1.0.1",
    "dj-database-url>=2.2.0",
    "psycopg[binary]>=3.2.1",
    "gunicorn>=23.0.0",
    "whitenoise>=6.7.0",
]

[tool.uv]
package = false
